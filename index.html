<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahhheleeera Shstmr Pro - Anti-System Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ccff00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <header class="app-header">
        
        <!-- LOGO AUTO (Se muestra cuando está en modo Car) -->
        <div id="logo-car" class="header-logo">
            <svg width="200" height="90" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
                <path d="M20,50 L40,25 L120,25 L150,50 L180,50 L180,65 L20,65 Z" fill="#111" stroke="#ccff00" stroke-width="4"/>
                <rect x="50" y="32" width="35" height="15" fill="#ccff00" opacity="0.9"/>
                <rect x="95" y="32" width="25" height="15" fill="#ccff00" opacity="0.9"/>
                <g class="flame-particle">
                    <path d="M25,65 C10,65 0,55 5,45 C12,52 15,40 25,50 C20,58 30,60 25,65 Z" fill="#ff003c"/>
                    <path d="M30,65 C20,65 10,58 15,50 C20,55 22,46 30,55 Z" fill="#ccff00"/>
                </g>
                <g class="flame-particle">
                    <path d="M115,65 C100,65 90,55 95,45 C102,52 105,40 115,50 C110,58 120,60 115,65 Z" fill="#ff003c"/>
                    <path d="M120,65 C110,65 100,58 105,50 C110,55 112,46 120,55 Z" fill="#ccff00"/>
                </g>
                <circle cx="45" cy="65" r="14" fill="#0a0a0a" stroke="#ccff00" stroke-width="4"/>
                <circle cx="45" cy="65" r="4" fill="#fff"/>
                <circle cx="135" cy="65" r="14" fill="#0a0a0a" stroke="#ccff00" stroke-width="4"/>
                <circle cx="135" cy="65" r="4" fill="#fff"/>
            </svg>
        </div>

        <!-- LOGO BICI FIXIE + CALAVERAS (Se muestra en modo Bicycle) -->
        <div id="logo-bike" class="header-logo" style="display: none;">
            <svg width="200" height="90" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
                <!-- Marco Fixie (Geometría Agresiva) -->
                <line x1="60" y1="65" x2="95" y2="25" stroke="#ccff00" stroke-width="5" stroke-linecap="square"/>
                <line x1="95" y1="25" x2="145" y2="25" stroke="#ccff00" stroke-width="5" stroke-linecap="square"/>
                <line x1="145" y1="25" x2="155" y2="65" stroke="#ccff00" stroke-width="5" stroke-linecap="square"/>
                <line x1="145" y1="25" x2="95" y2="65" stroke="#ccff00" stroke-width="5" stroke-linecap="square"/>
                <line x1="60" y1="65" x2="95" y2="65" stroke="#ccff00" stroke-width="5" stroke-linecap="square"/>
                <!-- Horquilla y Manubrio -->
                <line x1="145" y1="25" x2="135" y2="10" stroke="#fff" stroke-width="4" stroke-linecap="square"/>
                <path d="M135,10 Q145,5 155,15" fill="none" stroke="#fff" stroke-width="4"/>
                <!-- Asiento -->
                <line x1="95" y1="25" x2="90" y2="15" stroke="#fff" stroke-width="4"/>
                <path d="M80,15 L100,15" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
                <!-- Ruedas en Llamas -->
                <g class="flame-particle">
                    <path d="M40,65 C25,65 15,55 20,45 C27,52 30,40 40,50 C35,58 45,60 40,65 Z" fill="#ff003c"/>
                    <path d="M45,65 C35,65 25,58 30,50 C35,55 37,46 45,55 Z" fill="#ccff00"/>
                </g>
                <g class="flame-particle">
                    <path d="M135,65 C120,65 110,55 115,45 C122,52 125,40 135,50 C130,58 140,60 135,65 Z" fill="#ff003c"/>
                    <path d="M140,65 C130,65 120,58 125,50 C130,55 132,46 140,55 Z" fill="#ccff00"/>
                </g>
                <circle cx="60" cy="65" r="22" fill="none" stroke="#222" stroke-width="4"/>
                <circle cx="155" cy="65" r="22" fill="none" stroke="#222" stroke-width="4"/>
                <!-- Ejes Calavera -->
                <text x="50" y="72" font-size="20">💀</text>
                <text x="145" y="72" font-size="20">💀</text>
            </svg>
        </div>

        <h1 class="app-title">AHHELEERA</h1>
        <p style="font-family: monospace; font-size: 0.7rem; color: #ff003c; letter-spacing: 2px;">SHSHTMR</p>
    </header>

    <div class="container">
        <!-- Modo de Batalla -->
        <div class="card">
            <div class="toggle-group">
                <label class="toggle-btn">
                    <input type="radio" name="vehicleMode" value="car" checked onchange="actualizarModoViaje()">
                    <span>🚗 MÁQUINA</span>
                </label>
                <label class="toggle-btn">
                    <input type="radio" name="vehicleMode" value="bicycle" onchange="actualizarModoViaje()">
                    <span>🚲 FIXIE PUNK</span>
                </label>
            </div>

            <div class="input-group">
                <label>🗺️ NAVEGADOR DE COMBATE:</label>
                <select id="gpsSelect" onchange="guardarPreferenciaGPS()">
                    <option value="google">Google Maps</option>
                    <option value="waze">Waze</option>
                </select>
            </div>

            <div class="input-group">
                <label>👁️ OJO BIÓNICO (IA):</label>
                <input type="file" id="labelCameraInput" accept="image/*" capture="environment" onchange="escanearEtiquetaConIA(event)" style="display: none;">
                <button class="btn btn-action" onclick="document.getElementById('labelCameraInput').click()">
                    [ ESCANEAR ETIQUETA / SACAR INFO ]
                </button>
            </div>

            <div class="input-group autocomplete-container">
                <label>🔍 RASTREADOR (SOLO STGO):</label>
                <input type="text" id="autocompleteInput" placeholder="Busca una calle en la urbe..." oninput="onDireccionInput()" autocomplete="off">
                <div id="suggestionsBox" class="suggestions-box"></div>
            </div>

            <div class="input-group">
                <label>📦 LA MISIÓN (DIRECCIONES):</label>
                <textarea id="addressInput" placeholder="Pega los objetivos aquí..."></textarea>
            </div>
            
            <button class="btn btn-primary" onclick="procesarYOptimizar()">⚡ DESTRUIR LA RUTA (OPTIMIZAR)</button>
            <button class="btn btn-danger" onclick="limpiarRutaGuardada()">💀 QUEMAR EVIDENCIA (LIMPIAR)</button>
            <div id="status" class="status-bar">SISTEMA A LA ESPERA...</div>
        </div>

        <!-- Resultados -->
        <div id="routeContainer" style="display: none;">
            <div id="nextStopAction" class="card highlight-card"></div>
            <div id="map" class="map-container"></div>
            <div id="stopsList" class="stops-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
