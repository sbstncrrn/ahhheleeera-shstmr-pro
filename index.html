<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahhheleeera Shstmr Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5722">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <header class="app-header">
        <h1 class="app-title">Ahhheleeera Pro</h1>
    </header>

    <div class="container">
        <!-- Controles de Configuración -->
        <div class="card">
            <div class="toggle-group">
                <label class="toggle-btn">
                    <input type="radio" name="vehicleMode" value="car" checked onchange="actualizarModoViaje()">
                    <span>🚗 Auto</span>
                </label>
                <label class="toggle-btn">
                    <input type="radio" name="vehicleMode" value="bicycle" onchange="actualizarModoViaje()">
                    <span>🚲 Bicicleta</span>
                </label>
            </div>

            <div class="input-group">
                <label>🗺️ Navegador:</label>
                <select id="gpsSelect" onchange="guardarPreferenciaGPS()">
                    <option value="google">Google Maps</option>
                    <option value="waze">Waze</option>
                </select>
            </div>

            <div class="input-group">
                <label>📸 Escáner con IA:</label>
                <input type="file" id="labelCameraInput" accept="image/*" capture="environment" onchange="escanearEtiquetaConIA(event)" style="display: none;">
                <button class="btn btn-action" onclick="document.getElementById('labelCameraInput').click()">
                    📷 Escanear Etiqueta (Dirección + Teléfono)
                </button>
            </div>

            <div class="input-group">
                <label>📦 Direcciones a repartir:</label>
                <textarea id="addressInput" placeholder="Pega las direcciones aquí..."></textarea>
            </div>
            
            <button class="btn btn-primary" onclick="procesarYOptimizar()">🔥 Optimizar Ruta</button>
            <button class="btn btn-danger" onclick="limpiarRutaGuardada()">🗑️ Limpiar Ruta</button>
            <div id="status" class="status-bar">Esperando instrucciones...</div>
        </div>

        <!-- Resultados y Mapa -->
        <div id="routeContainer" style="display: none;">
            <div id="nextStopAction" class="card highlight-card"></div>
            <div id="map" class="map-container"></div>
            <div id="stopsList" class="stops-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
